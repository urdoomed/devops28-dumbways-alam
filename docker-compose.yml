version: '4'
services:
  database:
    image: mysql:8.0
    container_name: wayshub-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - wayshub-network


  backend:
    build: ./backend/wayshub-backend
    container_name: wayshub-backend
    restart: always
    env_file:
      - ./backend/wayshub-backend/.env
    depends_on:
      - database
    environment:
      - NODE_ENV=production
      - PORT=5000
    ports:
      - "5000:5000"
    networks:
      - wayshub-network


  frontend:
    build: ./frontend/wayshub-frontend
    container_name: wayshub-frontend
    stdin_open: true
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - wayshub-network


networks:
  wayshub-network:
    driver: bridge

volumes:
  db_data:

