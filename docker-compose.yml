services:
  database:
    image: mysql:8.0
    container_name: wayshub-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - wayshub-network


  backend:
    build: ./backend/wayshub-backend
    image: hardiansyahpermata/wayshub-backend:production
    container_name: wayshub-backend
    restart: always
    env_file:
      - ./backend/wayshub-backend/.env
    depends_on:
      - database
    environment:
      - NODE_ENV=production
      - PORT=5000
    networks:
      - wayshub-network


  frontend:
    build: ./frontend/wayshub-frontend
    image: hardiansyahpermata/wayshub-frontend:production
    container_name: wayshub-frontend
    stdin_open: true
    restart: always
    depends_on:
      - backend
    networks:
      - wayshub-network

  nginx:
    image: nginx:alpine
    container_name: wayshub-nginx-proxy
    restart: always
    ports:
      - "8081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    networks:
      - wayshub-network


networks:
  wayshub-network:
    driver: bridge

volumes:
  db_data:


