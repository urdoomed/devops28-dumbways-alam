name: Backend CI/CD

on:
  push:
    branches: [ "master" ]

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    environment: production 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }} # Diubah
          password: ${{ secrets.REGISTRY_PASSWORD }} # Diubah

      - name: Build Backend Image
        run: |
          cd backend/wayshub-backend
          docker build -t ${{ secrets.REGISTRY_USERNAME }}/wayshub-backend:production .

      - name: Test Backend Application
        run: 
          docker run --rm ${{ secrets.REGISTRY_USERNAME }}/wayshub-backend:production node -v

      - name: Push Backend Image
        run: |
          docker push ${{ secrets.REGISTRY_USERNAME }}/wayshub-backend:production

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/alam/wayshub
            git fetch --all
            git reset --hard origin/master
            docker rm -f wayshub-backend || true
            docker compose up -d --no-deps backend

      - name: Send Discord Notification
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            STATUS="✅ **Backend Build SUCCESS**"
          else
            STATUS="❌ **Backend Build FAILED**"
          fi
          curl -H "Content-Type: application/json" -X POST -d "{\"content\": \"$STATUS\nLog: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" ${{ secrets.DISCORD_WEBHOOK }}
