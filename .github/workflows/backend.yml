name: Backend CI/CD Pipeline

on:
  push:
    branches: [ "master" ]

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build Image
        run: |
          cd backend/wayshub-backend
          docker build -t ${{ secrets.REGISTRY_USERNAME }}/wayshub-backend:production .

      - name: Test Application
        run: |
          docker run --rm ${{ secrets.REGISTRY_USERNAME }}/wayshub-backend:production node -v

      - name: Push to Docker Hub
        run: |
          docker push ${{ secrets.REGISTRY_USERNAME }}/wayshub-backend:production

  deploy:
    needs: build-test-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          script: |
            cd /home/alam/wayshub
            git fetch --all
            git reset --hard origin/master
            docker rm -f wayshub-backend || true
            docker compose up -d --no-deps backend

  notify:
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Send Discord Notification
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            STATUS="✅ **Backend CI/CD SUCCESS**"
          else
            STATUS="❌ **Backend CI/CD FAILED**"
          fi
          curl -H "Content-Type: application/json" -X POST -d "{\"content\": \"$STATUS\nLog: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" ${{ secrets.DISCORD_WEBHOOK }}
