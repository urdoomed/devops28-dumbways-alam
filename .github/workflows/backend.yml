name: Basic Backend CI/CD

on:
  push:
    branches: [ "master" ]

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    environment: production 

    steps:
      # 1. PULL DARI REPOSITORY
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. LOGIN KE DOCKER HUB
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # 3. DOCKERIZE / BUILD
      - name: Build Image
        run: |
          cd backend/wayshub-backend
          docker build -t ${{ secrets.REGISTRY_USERNAME }}/wayshub-backend:production .

      # 4. TEST APPLICATION
      - name: Test Application
        run: |
          docker run --rm ${{ secrets.REGISTRY_USERNAME }}/wayshub-backend:production node -v

      # 5. PUSH KE DOCKER HUB
      - name: Push to Docker Hub
        run: |
          docker push ${{ secrets.REGISTRY_USERNAME }}/wayshub-backend:production

      # 6. DEPLOY ON TOP DOCKER (via SSH)
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          script: |
            cd /home/alam/wayshub
            git fetch --all
            git reset --hard origin/master
            docker rm -f wayshub-backend || true
            docker compose up -d --no-deps backend

      # 7. NOTIFIKASI KE DISCORD
      - name: Send Discord Notification
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            STATUS="✅ **Backend CI/CD SUCCESS**"
          else
            STATUS="❌ **Backend CI/CD FAILED**"
          fi
          curl -H "Content-Type: application/json" -X POST -d "{\"content\": \"$STATUS\nLog: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" ${{ secrets.DISCORD_WEBHOOK }}
