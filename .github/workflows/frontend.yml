name: Frontend CI/CD Pipeline

on:
  push:
    branches: [ "master" ]

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    environment: production 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build Frontend Image
        run: |
          cd frontend/wayshub-frontend
          docker build -t ${{ secrets.REGISTRY_USERNAME }}/wayshub-frontend:production .

      - name: Test Frontend Application
        run: |
          docker run --rm ${{ secrets.REGISTRY_USERNAME }}/wayshub-frontend:production nginx -v

      - name: Push Frontend Image
        run: |
          docker push ${{ secrets.REGISTRY_USERNAME }}/wayshub-frontend:production

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/alam/wayshub
            git fetch --all
            git reset --hard origin/master
            docker rm -f wayshub-frontend || true
            docker compose up -d --no-deps frontend

      - name: Send Discord Notification
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            STATUS="✅ **Frontend Build SUCCESS**"
          else
            STATUS="❌ **Frontend Build FAILED**"
          fi
          curl -H "Content-Type: application/json" -X POST -d "{\"content\": \"$STATUS\nLog: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" ${{ secrets.DISCORD_WEBHOOK }}
